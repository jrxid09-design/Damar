<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>DAMAR - Super AI Agent | Control Center &amp; Operating Environment</title>
  <link rel="icon" type="image/png" href="damaricon-clean.png" />
  <!-- Design tokens and layout: verbatim CC2-M2 accepted stylesheet (src/control/control.css). -->
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <a class="skip-link" href="#mainWorkspaceContent" data-i18n="Skip to main content">Skip to main content</a>

  <div class="app-shell" id="dashboardShell">
    <aside class="sidebar" id="appSidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <div class="brand-identity" id="brandHomeBtn" role="button" tabindex="0" title="DAMAR Control Center">
          <div class="brand-monogram"><img src="damaricon-clean.png" alt="DAMAR" class="brand-logo-img" /></div>
          <div class="brand-titles">
            <span class="brand-wordmark">DAMAR</span>
            <span class="brand-descriptor">Super AI Agent</span>
          </div>
        </div>
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Toggle Sidebar (Ctrl+B)" aria-label="Collapse Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNavContainer" aria-label="Views"></nav>
      <div class="sidebar-footer">
        <button type="button" class="idle-surface-link" id="openIdlePresenceSidebarBtn" title="Idle Presence is a separate desktop surface">
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--damar-accent)" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="sidebar-footer-text" data-i18n="Idle Presence Surface">Idle Presence Surface</span>
          </span>
          <span class="sidebar-footer-text" style="color:var(--damar-accent);font-size:12px;">↗</span>
        </button>
        <div class="sidebar-endpoint-meta sidebar-footer-text">
          <span data-i18n="Core Host">Core Host</span>
          <span id="sidebarEndpointLabel">-</span>
        </div>
      </div>
    </aside>

    <div class="workspace-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false" aria-controls="appSidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="breadcrumb" aria-label="Breadcrumb">
            <span class="breadcrumb-root" id="breadcrumbGroup">Workspace</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="breadcrumbTitle">Overview</span>
          </div>
        </div>
        <div class="topbar-center">
          <button type="button" class="cmd-trigger" id="cmdPaletteTriggerBtn" aria-label="Open command palette" title="Search views and actions (Ctrl + K)">
            <span class="cmd-trigger-left">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span data-i18n="Search capabilities, models, tools, or jump to view...">Search capabilities, models, tools, or jump to view...</span>
            </span>
            <span class="kbd-shortcut">Ctrl + K</span>
          </button>
        </div>
        <div class="topbar-right">
          <button type="button" class="runtime-truth-pill" id="runtimeTruthBadgeBtn" aria-label="Open runtime status" title="Live DAMAR Core lifecycle state">
            <span class="status-dot dot-neutral" id="runtimeTruthDot"></span>
            <span id="runtimeTruthState">CONNECTING</span><span class="hide-xs">CORE</span>
            <span class="hide-xs" style="color:var(--text-secondary);font-weight:400;" id="runtimeTruthDetail">• Owner session</span>
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="topbarNewTaskBtn" title="Delegate a Pandawa run through Core" aria-label="Delegate Pandawa run">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="hide-xs" data-i18n="New Run">New Run</span>
          </button>
          <button type="button" class="btn btn-ghost btn-sm" id="topbarNotifBtn" aria-label="Pending permissions reported by Core" title="Pending permissions reported by Core" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="badge badge-neutral" id="topbarPendingCount" style="padding:0 5px;font-size:10px;">–</span>
          </button>
          <button type="button" class="btn btn-ghost btn-sm" id="topbarSettingsBtn" title="Core Settings" aria-label="Open settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>
      <main class="main-content" id="mainWorkspaceContent" role="main"></main>
    </div>
  </div>

  <!-- Command palette (Ctrl + K) -->
  <div class="overlay-backdrop" id="cmdPaletteBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Command Palette" tabindex="-1">
    <div class="modal-dialog">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--damar-accent)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="cli-cmd-input" id="cmdPaletteSearchInput" aria-label="Search commands and modules" placeholder="Type a view or action name..." />
        <button type="button" class="btn btn-ghost btn-sm" id="closeCmdPaletteBtn" aria-label="Close command palette">Esc</button>
      </div>
      <div style="max-height:360px;overflow-y:auto;padding:8px;" id="cmdPaletteResults"></div>
    </div>
  </div>

  <!-- Owner action dialog: every mutation is confirmed here, then sent to Core with the Owner credential. -->
  <div class="overlay-backdrop" id="actionModalBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="actionModalTitle" tabindex="-1">
    <div class="modal-dialog">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <span class="panel-title" id="actionModalTitle">Owner action</span>
          <span class="badge badge-gold" data-i18n="Sent to DAMAR Core">Sent to DAMAR Core</span>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="closeActionModalBtn" aria-label="Close dialog">✕</button>
      </div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:14px;">
        <div id="actionModalBody"></div>
        <div id="actionModalError" role="alert" style="font-size:12px;color:var(--status-critical);"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--border-subtle);flex-wrap:wrap;">
          <span style="font-size:11px;color:var(--text-muted);" id="actionModalNote">Core enforces Owner authority; nothing changes until Core accepts.</span>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn btn-secondary" id="cancelActionModalBtn" data-i18n="Cancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="submitActionModalBtn" data-i18n="Confirm">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Inspector drawer -->
  <div class="drawer-backdrop" id="detailDrawerBackdrop" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Inspector Drawer" tabindex="-1">
    <aside class="detail-drawer">
      <div class="drawer-head">
        <div>
          <div class="page-kicker" id="drawerKicker">INSPECTOR</div>
          <div style="font-size:15px;font-weight:600;color:var(--text-ivory);" id="drawerTitle">Detail View</div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="closeDetailDrawerBtn" aria-label="Close inspector drawer">✕</button>
      </div>
      <div class="drawer-body" id="drawerBodyContent"></div>
    </aside>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <script src="support-links.js"></script>
  <script src="control.js"></script>
</body>
</html>

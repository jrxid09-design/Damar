<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="365" viewBox="0 0 1440 365" role="img" aria-labelledby="ft fd">
<title id="ft">DAMAR governed execution lifecycle</title><desc id="fd">A high contrast flow diagram: Observe, Plan, Authority Gate, Execute, Verify and Remember. A denied request stops at the authority gate.</desc>
<defs><linearGradient id="fbg" x2="1" y2="1"><stop stop-color="#0a0d15"/><stop offset="1" stop-color="#15151a"/></linearGradient><linearGradient id="fg" x2="1"><stop stop-color="#947044"/><stop offset=".5" stop-color="#ecd39a"/><stop offset="1" stop-color="#977248"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9e8c70"/></marker></defs>
<rect width="1440" height="365" rx="15" fill="url(#fbg)"/>
<rect x="1" y="1" width="1438" height="363" rx="14" fill="none" stroke="#554633"/>
<text x="46" y="51" font-family="Segoe UI,Arial,sans-serif" font-weight="bold" font-size="21" letter-spacing="3" fill="#f4e6ce">ONE PATH. EXPLICIT AUTHORITY.</text>
<text x="46" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#9e9c93">Requests move forward only when governed by a valid decision.</text>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <g><rect x="45" y="126" width="230" height="112" rx="13" fill="#1c2028" stroke="#40434a"/><text x="160" y="161" fill="#c7a56d" font-size="15" letter-spacing="2">01 / INPUT</text><text x="160" y="198" fill="#f5f0e3" font-size="25" font-weight="bold">Observe</text><text x="160" y="222" fill="#b9b4a8" font-size="14">events &amp; context</text></g>
 <g><rect x="325" y="126" width="230" height="112" rx="13" fill="#1c2028" stroke="#40434a"/><text x="440" y="161" fill="#c7a56d" font-size="15" letter-spacing="2">02 / INTENT</text><text x="440" y="198" fill="#f5f0e3" font-size="25" font-weight="bold">Propose</text><text x="440" y="222" fill="#b9b4a8" font-size="14">models &amp; manager</text></g>
 <g><rect x="605" y="116" width="230" height="132" rx="13" fill="#282318" stroke="#e1b972" stroke-width="2"/><text x="720" y="157" fill="#e8c785" font-size="15" letter-spacing="2">03 / AUTHORITY</text><text x="720" y="194" fill="#ffe2a3" font-size="25" font-weight="bold">Decide</text><text x="720" y="218" fill="#d1bb8a" font-size="14">owner-bound gate</text></g>
 <g><rect x="885" y="126" width="230" height="112" rx="13" fill="#1c2028" stroke="#40434a"/><text x="1000" y="161" fill="#c7a56d" font-size="15" letter-spacing="2">04 / ACTUATION</text><text x="1000" y="198" fill="#f5f0e3" font-size="25" font-weight="bold">Execute</text><text x="1000" y="222" fill="#b9b4a8" font-size="14">authorized effects</text></g>
 <g><rect x="1165" y="126" width="230" height="112" rx="13" fill="#1c2028" stroke="#40434a"/><text x="1280" y="161" fill="#c7a56d" font-size="15" letter-spacing="2">05 / EVIDENCE</text><text x="1280" y="198" fill="#f5f0e3" font-size="25" font-weight="bold">Verify</text><text x="1280" y="222" fill="#b9b4a8" font-size="14">audit &amp; continuity</text></g>
</g>
<g stroke="#9e8c70" stroke-width="2.4" fill="none" marker-end="url(#arr)"><path d="M275 182 H316"/><path d="M555 182 H596"/><path d="M835 182 H876"/><path d="M1115 182 H1156"/></g>
<path d="M720 249 V290 H610" stroke="#bb795a" stroke-width="2" fill="none"/>
<rect x="420" y="271" width="190" height="42" rx="20" fill="#2b1b1b" stroke="#a36e58"/>
<text x="515" y="298" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#f0c3ad">DENY / STOP</text>
<text x="720" y="340" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#9d9e9e">No model, plugin, or UI can grant itself authority to act.</text>
</svg>
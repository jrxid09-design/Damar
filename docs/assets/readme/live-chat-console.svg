<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 124" width="100%" height="124" role="img" aria-label="Live Chat with DAMAR">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0907"/>
      <stop offset="50%" stop-color="#14110a"/>
      <stop offset="100%" stop-color="#09090d"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2d11"/>
      <stop offset="50%" stop-color="#f5d78e"/>
      <stop offset="100%" stop-color="#3a2d11"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#5c420b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="marqueeClip">
      <rect x="112" y="54" width="600" height="34"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="958" height="122" rx="16" fill="url(#chatBg)" stroke="url(#borderGlow)" stroke-width="1.3"/>

  <!-- Pulsing Neural Orb -->
  <g transform="translate(56 62)">
    <circle r="24" fill="none" stroke="#d4af37" stroke-width="0.9" opacity="0.45">
      <animate attributeName="r" values="20;28;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="15" fill="url(#orbCore)">
      <animate attributeName="r" values="13;16.5;13" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Header Label + Equalizer -->
  <text x="114" y="42" fill="#f5d78e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.8">DAMAR LIVE CHAT</text>
  <text x="278" y="42" fill="#8f8160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">wisestechnology.com</text>

  <!-- Animated Audio Signal Bars -->
  <g transform="translate(432 30)" fill="#d4af37">
    <rect x="0" y="6" width="2.5" height="8" rx="1"><animate attributeName="height" values="4;14;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="9;4;9" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="6" y="4" width="2.5" height="12" rx="1"><animate attributeName="height" values="12;4;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="5;9;5" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="12" y="2" width="2.5" height="14" rx="1"><animate attributeName="height" values="6;15;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="8;3;8" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="18" y="5" width="2.5" height="9" rx="1"><animate attributeName="height" values="10;4;10" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="6;9;6" dur="1.0s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Smooth Running Text Track -->
  <rect x="112" y="56" width="602" height="36" rx="8" fill="#07070a" stroke="#2a2212" stroke-width="1"/>
  <g clip-path="url(#marqueeClip)">
    <text y="79" fill="#e6dcc0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5">
      <tspan>Halo, saya Damar. Klik di sini untuk mulai berdiskusi langsung di wisestechnology.com   |   Ask about DAMAR, Wises-D1, or your next workflow   |   </tspan>
      <animate attributeName="x" values="720;-980" dur="18s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- CTA Pill -->
  <g transform="translate(742 40)">
    <rect width="186" height="44" rx="10" fill="#d4af37">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="93" y="27" text-anchor="middle" fill="#08080c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4">OPEN LIVE CHAT</text>
  </g>
</svg>
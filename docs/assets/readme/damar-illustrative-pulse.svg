<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Illustrative task pulse for six sequential governed tasks</title>
  <desc id="d">Timeline strip of six sequential tasks in one illustrative session, with durations 0.8, 1.6, 2.4, 1.1, 2.0, and 0.9 seconds. Four tasks are verified, one awaits ratification, and one is held. Patterned fills and text labels distinguish statuses; not live telemetry.</desc>
  <defs>
    <pattern id="ratify" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#1d1a12"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e0a458" stroke-width="2"/>
    </pattern>
    <pattern id="held" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#141419"/>
      <line x1="0" y1="0" x2="6" y2="6" stroke="#5a5b63" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="300" fill="#0d0d10"/>
  <text x="24" y="36" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#ece7d8">TASK PULSE — ILLUSTRATIVE</text>
  <text x="24" y="56" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8578">Six sequential tasks, one sample timeline. Not live telemetry.</text>

  <!-- timeline: track x=60..740 (680px) over 8.8s => 77.27 px/s; durations scaled -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="60"  y="110" width="62"  height="40" fill="#2e3a2e" stroke="#7f9c7f" opacity="0.95"/>
    <rect x="122" y="110" width="124" height="40" fill="#2e3a2e" stroke="#7f9c7f" opacity="0.95"/>
    <rect x="246" y="110" width="186" height="40" fill="#2e3a2e" stroke="#7f9c7f" opacity="0.95"/>
    <rect x="432" y="110" width="85"  height="40" fill="url(#ratify)" stroke="#e0a458"/>
    <rect x="517" y="110" width="155" height="40" fill="#2e3a2e" stroke="#7f9c7f" opacity="0.95"/>
    <rect x="672" y="110" width="68"  height="40" fill="url(#held)" stroke="#5a5b63"/>

    <text x="91"  y="135" fill="#cfe0cf">0.8s</text>
    <text x="184" y="135" fill="#cfe0cf">1.6s</text>
    <text x="339" y="135" fill="#cfe0cf">2.4s</text>
    <text x="474" y="135" fill="#e8c290">1.1s</text>
    <text x="594" y="135" fill="#cfe0cf">2.0s</text>
    <text x="706" y="135" fill="#bcb9ae">0.9s</text>
  </g>

  <!-- task tick labels -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6f6b60" text-anchor="middle">
    <text x="91"  y="98">T1</text>
    <text x="184" y="98">T2</text>
    <text x="339" y="98">T3</text>
    <text x="474" y="98">T4</text>
    <text x="594" y="98">T5</text>
    <text x="706" y="98">T6</text>
  </g>

  <!-- status legend: text-encoded, not color alone -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
    <rect x="60"  y="190" width="26" height="14" fill="#2e3a2e" stroke="#7f9c7f"/>
    <text x="96"  y="202" fill="#c9c4b4">Verified — T1, T2, T3, T5 (4)</text>
    <rect x="320" y="190" width="26" height="14" fill="url(#ratify)" stroke="#e0a458"/>
    <text x="356" y="202" fill="#c9c4b4">Awaiting ratification — T4 (1)</text>
    <rect x="60"  y="220" width="26" height="14" fill="url(#held)" stroke="#5a5b63"/>
    <text x="96"  y="232" fill="#c9c4b4">Held at authority gate — T6 (1)</text>
  </g>

  <text x="24" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6f6b60">Illustrative sample data — no real user, no external action, no live measurement.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260" role="img" aria-label="DAMAR Cinematic Hero">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0e0b06"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#f5d78e" stop-opacity="0.34"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="72%" stop-color="#6b4f12" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e7b24"/>
      <stop offset="35%" stop-color="#f5d78e"/>
      <stop offset="50%" stop-color="#fff4d2"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e7b24"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5d78e" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#bgGrad)" stroke="#2b2312" stroke-width="1"/>

  <!-- Breathing Golden Nebula -->
  <ellipse cx="500" cy="140" rx="340" ry="120" fill="url(#nebula)">
    <animate attributeName="rx" values="310;370;310" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Rotating Concentric Astrolabe Rings -->
  <g transform="translate(500 132)" opacity="0.45">
    <circle r="118" fill="none" stroke="#d4af37" stroke-width="0.7" stroke-dasharray="6 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
    </circle>
    <circle r="92" fill="none" stroke="#f5d78e" stroke-width="0.8" stroke-dasharray="28 18 4 18">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
    </circle>
    <circle r="66" fill="none" stroke="#a68124" stroke-width="0.6" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Gold-Ember Stardust Particles -->
  <g fill="#f5d78e" filter="url(#softGlow)">
    <circle cx="190" cy="210" r="1.4"><animate attributeName="cy" values="230;40" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="180" r="1.1"><animate attributeName="cy" values="240;60" dur="6.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="220" r="1.6"><animate attributeName="cy" values="235;35" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="195" r="1.2"><animate attributeName="cy" values="225;50" dur="7.2s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="7.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="205" r="1.5"><animate attributeName="cy" values="230;45" dur="7.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="7.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="225" r="1.2"><animate attributeName="cy" values="240;55" dur="6.8s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6.8s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="190" r="1.7"><animate attributeName="cy" values="235;40" dur="8.6s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="825" cy="215" r="1.3"><animate attributeName="cy" values="230;65" dur="7.4s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="7.4s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="210" r="1.4"><animate attributeName="cy" values="235;30" dur="6.2s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.2s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Sweeping Horizon Light -->
  <rect x="-250" y="258" width="260" height="2" fill="url(#scanline)">
    <animate attributeName="x" values="-260;1020" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle Eyebrow -->
  <text x="500" y="88" text-anchor="middle" fill="#c9ae68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="5">LOCAL-FIRST PERSONAL AI SYSTEM</text>

  <!-- Main Shimmering Title -->
  <text x="500" y="148" text-anchor="middle" fill="url(#goldShimmer)" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="600" letter-spacing="14" filter="url(#softGlow)">DAMAR</text>

  <!-- Subtitle -->
  <text x="500" y="186" text-anchor="middle" fill="#d8cca8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" letter-spacing="1.2">Super AI Agent built for continuity, coordination, and accountable action</text>

  <!-- Pulsing Status Indicator -->
  <g transform="translate(414 218)">
    <circle cx="0" cy="0" r="3.5" fill="#f5d78e">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#d4af37" stroke-width="0.9">
      <animate attributeName="r" values="4;10;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" fill="#a89563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">ACTIVE DEVELOPMENT</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="ht hd">
<title id="ht">DAMAR — The governed AI assistant runtime</title>
<desc id="hd">Dark charcoal and warm gold premium DAMAR identity with a luminous abstract orbital emblem, architectural grid and the words Think, Remember, Govern, Verify.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090c13"/><stop offset=".6" stop-color="#10131b"/><stop offset="1" stop-color="#080a0f"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#c89b53" stop-opacity=".30"/><stop offset=".42" stop-color="#9b6432" stop-opacity=".11"/><stop offset="1" stop-color="#b37d35" stop-opacity="0"/></radialGradient>
 <radialGradient id="core" cx=".35" cy=".30" r=".78"><stop stop-color="#fff2b9"/><stop offset=".19" stop-color="#f5d589"/><stop offset=".46" stop-color="#c6883c"/><stop offset=".78" stop-color="#654026"/><stop offset="1" stop-color="#151a25"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a4763c"/><stop offset=".52" stop-color="#f4dca1"/><stop offset="1" stop-color="#9d7238"/></linearGradient>
 <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d1a25c" stop-opacity="0"/><stop offset=".6" stop-color="#d1a25c" stop-opacity=".4"/><stop offset="1" stop-color="#d1a25c" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#8e856f" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>

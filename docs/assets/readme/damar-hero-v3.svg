<text x="80" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="26" letter-spacing="6" fill="url(#gold)">THE GOVERNED AI RUNTIME</text>
<text x="80" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#b9b6ad">A single identity across memory, models, tools</text>
<text x="80" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#b9b6ad">and interfaces. Authority always comes first.</text>

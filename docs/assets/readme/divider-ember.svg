<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="100%" height="10" role="presentation">
  <defs>
    <linearGradient id="baseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5c4818" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff0c2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4.5" width="1000" height="1" fill="url(#baseLine)"/>
  <rect x="-220" y="4" width="220" height="2" rx="1" fill="url(#pulseBeam)">
    <animate attributeName="x" values="-220;1020" dur="4.2s" repeatCount="indefinite"/>
  </rect>
</svg>